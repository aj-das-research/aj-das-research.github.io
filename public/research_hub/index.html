<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Research Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700&display=swap" rel="stylesheet">
<style>
:root { --bg: #f0e7db; --card: #fbf6ef; --ink: #1a1a1d; --muted: #6b6560; --line: #d8cbbb; --accent: #3d7aed; }
@media (prefers-color-scheme: dark) { :root { --bg: #202023; --card: #2a2a2e; --ink: #ececec; --muted: #a09a94; --line: #3b3b40; --accent: #ff63c3; } }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink);
       font: 15px/1.5 system-ui, -apple-system, sans-serif; padding: 16px; }
form { width: 100%; max-width: 360px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 28px; }
h1 { font-family: 'M PLUS Rounded 1c', sans-serif; font-size: 22px; margin: 0 0 4px; }
p { color: var(--muted); margin: 0 0 18px; font-size: 14px; }
input[type=password] { width: 100%; height: 44px; padding: 0 13px; border: 1px solid var(--line); border-radius: 9px;
                       background: transparent; color: var(--ink); font: inherit; }
label { display: flex; gap: 8px; align-items: center; margin: 12px 0 16px; font-size: 14px; color: var(--muted); }
button { width: 100%; height: 42px; border: 0; border-radius: 9px; background: var(--accent); color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
#err { color: #d64545; font-size: 14px; min-height: 20px; margin-top: 10px; }
</style>
</head>
<body>
<form id="f">
  <h1>Research Hub</h1>
  <p>Private. Enter the passphrase to open it.</p>
  <input type="password" id="pw" autocomplete="current-password" autofocus aria-label="Passphrase">
  <label><input type="checkbox" id="keep"> Remember on this device</label>
  <button>Open</button>
  <div id="err" role="alert"></div>
</form>

  e.preventDefault();
  const err = document.getElementById('err'); err.textContent = 'Opening…';
  try {
    const key = await derive(document.getElementById('pw').value);
    if (document.getElementById('keep').checked) {
      const raw = new Uint8Array(await crypto.subtle.exportKey('raw', key));
      try { localStorage.setItem(storeKey, btoa(String.fromCharCode(...raw))); } catch (_) {}
    }
    await open(key);
  } catch (e) { err.textContent = 'Wrong passphrase.'; }
});
</script>
