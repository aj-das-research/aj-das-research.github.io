<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Research Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700&display=swap" rel="stylesheet">
<style>
:root { --bg: #f0e7db; --card: #fbf7f1; --ink: #1d1c1f; --muted: #7a726a; --line: #e0d3c2; --accent: #3d7aed; }
@media (prefers-color-scheme: dark) { :root { --bg: #202023; --card: #29292d; --ink: #ededed; --muted: #9b958f; --line: #3a3a40; --accent: #ff63c3; } }
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 system-ui, -apple-system, sans-serif; }
#gate { min-height: 100%; display: grid; place-items: center; padding: 16px; }
form { width: 100%; max-width: 360px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 28px; }
h1 { font-family: 'M PLUS Rounded 1c', sans-serif; font-size: 22px; margin: 0 0 4px; }
p { color: var(--muted); margin: 0 0 18px; font-size: 14px; }
input[type=password] { width: 100%; height: 44px; padding: 0 13px; border: 1px solid var(--line); border-radius: 9px; background: transparent; color: var(--ink); font: inherit; }
label { display: flex; gap: 8px; align-items: center; margin: 12px 0 16px; font-size: 14px; color: var(--muted); }
button { width: 100%; height: 42px; border: 0; border-radius: 9px; background: var(--accent); color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
button:disabled { opacity: .65; cursor: default; }
#err { color: var(--muted); font-size: 14px; min-height: 20px; margin-top: 10px; }
#opening { color: var(--muted); font-size: 14px; }
#app { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; background: var(--bg); }
[hidden] { display: none !important; }
</style>
</head>
<body>
<div id="gate">
  <div id="opening" hidden>Opening the Research Hub…</div>
  <form id="f" hidden>
    <h1>Research Hub</h1>
    <p>Private. Enter the passphrase to open it.</p>
    <input type="password" id="pw" autocomplete="current-password" aria-label="Passphrase">
    <label><input type="checkbox" id="keep"> Remember on this device</label>
    <button id="go">Open</button>
    <div id="err" role="alert"></div>
  </form>
</div>

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const storeKey = 'rh-key-' + SALT;
const store = {get: () => { try { return localStorage.getItem(storeKey); } catch (_) { return null; } },
               set: v => { try { localStorage.setItem(storeKey, v); } catch (_) {} },
               del: () => { try { localStorage.removeItem(storeKey); } catch (_) {} }};
const $ = id => document.getElementById(id);
async function derive(pw) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name: 'PBKDF2', salt: b64(SALT), iterations: ITER, hash: 'SHA-256'},
                                 base, {name: 'AES-GCM', length: 256}, true, ['decrypt']);
}
const decrypt = async key => new TextDecoder().decode(await crypto.subtle.decrypt({name: 'AES-GCM', iv: b64(IV)}, key, b64(BLOB)));
// The hub runs in its own frame, so the locked page and the hub can never mix.
function mount(html) {
  $('gate').remove();
  const app = document.createElement('iframe');
  app.id = 'app'; app.title = 'Research Hub'; app.srcdoc = html;
  document.body.append(app);
  window.addEventListener('message', e => { if (e.source === app.contentWindow && e.data && e.data.rh === 'lock') { store.del(); location.reload(); } });
}
function showForm(msg) { $('opening').hidden = true; $('f').hidden = false; $('err').textContent = msg || ''; $('pw').focus(); }
(async () => {
  const raw = store.get();
  if (!raw) return showForm();
  $('opening').hidden = false;
  try { mount(await decrypt(await crypto.subtle.importKey('raw', b64(raw), 'AES-GCM', false, ['decrypt']))); }
  catch (e) { store.del(); showForm('The hub was updated with a new passphrase. Enter it again.'); }
})();
$('f').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = $('go'); btn.disabled = true; $('err').style.color = ''; $('err').textContent = 'Opening…';
  try {
    const key = await derive($('pw').value), html = await decrypt(key);
    if ($('keep').checked) store.set(btn64(new Uint8Array(await crypto.subtle.exportKey('raw', key))));
    mount(html);
  } catch (err) { btn.disabled = false; $('err').textContent = 'Wrong passphrase.'; $('err').style.color = '#d64545'; $('pw').select(); }
});
const btn64 = a => btoa(String.fromCharCode(...a));
