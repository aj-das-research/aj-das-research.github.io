<article class="publication" id="paper-{{ .id }}" aria-labelledby="title-{{ .id }}">
  <figure class="paper-visual" aria-labelledby="caption-{{ .id }}">
    <a class="paper-figure-link" href="{{ .figure.full | relURL }}" target="_blank" rel="noopener" aria-label="Open full-size figure for {{ .title }} (new tab)">
      <img src="{{ .figure.src | relURL }}" alt="{{ .figure.alt }}" width="{{ .figure.width }}" height="{{ .figure.height }}" loading="lazy" decoding="async">
    </a>
    <figcaption id="caption-{{ .id }}">
      <a class="figure-source" href="{{ .figure.source }}">{{ .figure.caption }}</a>
      <a class="figure-expand" href="{{ .figure.full | relURL }}" target="_blank" rel="noopener" aria-label="View full-size figure for {{ .title }} (new tab)">Full size ↗</a>
    </figcaption>
  </figure>
  <div class="publication-content">
    <h3 id="title-{{ .id }}"><a href="{{ .url }}">{{ .title }}</a></h3>
    <p class="publication-meta">{{ .year }} · {{ .venue }}</p>
    <p class="authors">{{ .authors }}</p>
    <div class="publication-actions">
      <a href="{{ .url }}">Paper</a>
      {{ with .code }}<a href="{{ . }}">Code</a>{{ end }}
      <details><summary>Abstract</summary><p class="abstract">{{ .summary }}</p></details>
    </div>
  </div>
</article>
