<article class="publication" id="paper-{{ .id }}" aria-labelledby="title-{{ .id }}">
  <figure class="paper-visual" data-scene="{{ .id }}" aria-labelledby="caption-{{ .id }}">
    <div class="scene-stage">
      <img class="scene-fallback" src="{{ printf "media/scenes/%s.svg" .id | relURL }}" alt="{{ .visualization.description }}" width="480" height="220" loading="lazy">
      <canvas hidden tabindex="0" role="img" aria-label="{{ .visualization.label }} — interactive 3D illustration" aria-describedby="description-{{ .id }}"></canvas>
    </div>
    <figcaption>
      <div class="scene-controls" hidden>
        <button type="button" data-motion aria-pressed="false" aria-label="Pause animation for {{ .id }}">Pause</button>
        <button type="button" data-reset aria-label="Reset view for {{ .id }}">Reset</button>
      </div>
      <span id="caption-{{ .id }}">{{ .visualization.label }}</span>
    </figcaption>
    <p id="description-{{ .id }}" class="visually-hidden">{{ .visualization.description }} Conceptual illustration, not experimental data. Drag horizontally or use arrow keys to rotate.</p>
  </figure>
  <div class="publication-content">
    <h3 id="title-{{ .id }}"><a href="{{ .url }}">{{ .title }}</a></h3>
    <p class="publication-meta">{{ .year }} · {{ .venue }}</p>
    <p class="authors">{{ .authors }}</p>
    <div class="publication-actions">
      <a href="{{ .url }}">Paper</a>
      {{ with .code }}<a href="{{ . }}">Code</a>{{ end }}
      <details><summary>Abstract</summary><p class="abstract">{{ .summary }}</p></details>
    </div>
  </div>
</article>
